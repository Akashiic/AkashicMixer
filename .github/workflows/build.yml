name: Build

# Builds the mod on every push and pull request and publishes every jar and the SHA256SUMS file as its own
# artifact, NOT zipped (upload-artifact v7, archive: false; delivery protocol in AGENTS.md). Actions run page ->
# "Artifacts": each entry downloads as the plain .jar / .txt file. JARs are never committed to the repository.

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout with full history (the version comes from git)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 8 (mod bytecode, dev runtime) and 21 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Name and hash the jars (one plain file each, never a zip)
        id: jars
        run: |
          sha=$(git rev-parse --short=7 HEAD)
          mkdir dist
          for f in build/libs/*.jar; do
            b=$(basename "$f" .jar)
            case "$b" in
              *-dev-preshadow) kind=-dev-preshadow ;;
              *-dev) kind=-dev ;;
              *-sources) kind=-sources ;;
              *) kind= ;;
            esac
            cp "$f" "dist/akashicmixer-$sha$kind.jar"
          done
          cd dist
          sha256sum *.jar | tee "SHA256SUMS-$sha.txt"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload the mod jar (the one players install)
        uses: actions/upload-artifact@v7
        with:
          path: dist/akashicmixer-${{ steps.jars.outputs.sha }}.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the dev jar
        uses: actions/upload-artifact@v7
        with:
          path: dist/akashicmixer-${{ steps.jars.outputs.sha }}-dev.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the sources jar
        uses: actions/upload-artifact@v7
        with:
          path: dist/akashicmixer-${{ steps.jars.outputs.sha }}-sources.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the checksums
        uses: actions/upload-artifact@v7
        with:
          path: dist/SHA256SUMS-${{ steps.jars.outputs.sha }}.txt
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
