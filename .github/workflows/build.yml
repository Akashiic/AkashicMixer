name: Build

# Builds the mod on every push and pull request and publishes the jars as a downloadable artifact
# (Actions run page -> "Artifacts"). JARs are never committed to the repository.

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout with full history (the version comes from git)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 8 (mod bytecode, dev runtime) and 21 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Name and hash the jars
        id: jars
        run: |
          cd build/libs
          sha256sum *.jar | tee SHA256SUMS.txt
          echo "name=akashicmixer-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload the jars
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jars.outputs.name }}
          path: |
            build/libs/*.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
